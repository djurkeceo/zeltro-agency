      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        overflow-x: hidden;
      }
      body {
        font-family: "DM Sans", sans-serif;
        font-size: 16px;
        line-height: 1.7;
        color: #f7fbff;
        background: #05070d;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        min-height: 100vh;
        position: relative;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Syne", sans-serif;
        line-height: 1.06;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      h1 {
        font-size: clamp(2.8rem, 8vw, 6.2rem);
      }
      h2 {
        font-size: clamp(2rem, 5vw, 4.3rem);
      }
      p {
        color: #b8c6e3;
        font-weight: 500;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font-family: "DM Sans", sans-serif;
        cursor: pointer;
        border: none;
        background: none;
      }
      .container {
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 1.4rem;
      }
      section {
        padding: 7rem 0;
        position: relative;
      }
      .hero {
        min-height: 100vh;
        display: flex;
        align-items: center;
        position: relative;
        overflow: hidden;
        padding-top: 7rem;
      }
      .hero-background {
        position: absolute;
        inset: 0;
        z-index: -1;
        overflow: hidden;
      }
      .gradient-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.18;
      }
      .orb-1 {
        width: min(480px, 55vw);
        height: min(480px, 55vw);
        background: radial-gradient(
          circle,
          rgba(91, 231, 255, 0.4) 0,
          rgba(91, 231, 255, 0) 68%
        );
        top: -6%;
        right: 0;
      }
      .orb-2 {
        width: min(380px, 45vw);
        height: min(380px, 45vw);
        background: radial-gradient(
          circle,
          rgba(118, 145, 255, 0.35) 0,
          rgba(118, 145, 255, 0) 68%
        );
        bottom: 5%;
        left: -4%;
      }
      .orb-3 {
        width: min(320px, 38vw);
        height: min(320px, 38vw);
        background: radial-gradient(
          circle,
          rgba(138, 124, 255, 0.3) 0,
          rgba(138, 124, 255, 0) 70%
        );
        top: 35%;
        left: 55%;
        transform: translate(-50%, -50%);
      }
      .hero-content {
        text-align: center;
        max-width: 900px;
        margin: 0 auto;
        padding: clamp(1rem, 2.5vw, 2rem);
      }
      .hero-title {
        margin-bottom: 1.2rem;
        line-height: 1.04;
        letter-spacing: -0.04em;
      }
      .hero-subtitle {
        font-size: clamp(1rem, 1.8vw, 1.2rem);
        max-width: 720px;
        margin: 0 auto 2.4rem;
        color: #b8c6e3;
        line-height: 1.75;
      }
      .hero-ctas {
        display: flex;
        gap: 0.9rem;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 3rem;
      }
      .btn {
        padding: 0.85rem 1.5rem;
        font-size: 0.95rem;
        font-weight: 700;
        border-radius: 999px;
        position: relative;
      }
      .btn-primary {
        background: linear-gradient(
          95deg,
          #5be7ff 0,
          #69b3ff 52%,
          #8a7cff 100%
        );
        color: #03111b;
        box-shadow: 0 10px 24px rgba(91, 231, 255, 0.22);
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.02);
        color: #f7fbff;
        border: 1px solid rgba(186, 214, 255, 0.25);
      }
      .hero-stats {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
      }
      .stat {
        text-align: center;
      }
      .stat + .stat {
        padding-left: 1.5rem;
        border-left: 1px solid rgba(186, 214, 255, 0.12);
      }
      .stat-value {
        font-size: clamp(1.6rem, 3vw, 2.3rem);
        margin-bottom: 0.3rem;
        font-weight: 700;
      }
      .stat-label {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #7f8fb1;
      }
      .gradient-text {
        background: linear-gradient(
          95deg,
          #5be7ff 0,
          #69b3ff 52%,
          #8a7cff 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        background-size: 200% auto;
      }
      .glass {
        background: rgba(13, 20, 37, 0.72);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(186, 214, 255, 0.2);
      }
      .section-title {
        margin-bottom: 1.2rem;
      }
      ::selection {
        background: #5be7ff;
        color: #05070d;
      }
      @media (max-width: 768px) {
        .container {
          padding: 0 1rem;
        }
        section {
          padding: 4rem 0;
        }
        .hero {
          min-height: 100svh;
          padding-top: 5.5rem;
        }
        .hero-ctas {
          flex-direction: column;
        }
        .btn {
          width: 100%;
        }
        .gradient-orb {
          animation: none;
          opacity: 0.15;
          filter: blur(50px);
        }
        .hero-stats {
          gap: 0.8rem;
        }
        .stat + .stat {
          padding-left: 0.8rem;
        }
      }
      @media (max-width: 560px) {
        .hero {
          padding-top: 5rem;
        }
        .hero-stats {
          flex-direction: column;
          align-items: center;
        }
        .stat + .stat {
          padding-left: 0;
          border-left: none;
          padding-top: 0.8rem;
          border-top: 1px solid rgba(186, 214, 255, 0.12);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        ::before,
        ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
