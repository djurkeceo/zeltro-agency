name: Build & Deploy to Vercel

on:
  push:
    branches: [master]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Podesi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instaliraj npm zavisnosti
        run: npm ci

      - name: Instaliraj Playwright + sistemske biblioteke
        run: npx playwright install --with-deps chromium

      - name: Instaliraj Vercel CLI
        run: npm install -g vercel

      - name: Povuci Vercel podesavanja projekta
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build projekta (ukljucuje prerendering)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy vec izgradjenog sajta
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
