name: Build & Deploy to Vercel

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Podesi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instaliraj npm zavisnosti
        run: npm ci

      # KLJUCNI KORAK: ubuntu-latest runner IMA apt-get/sudo, za razliku
      # od Vercel-ovog build sandboxa, pa ovo ovde stvarno uspeva.
      - name: Instaliraj Playwright + sistemske biblioteke
        run: npx playwright install --with-deps chromium

      - name: Instaliraj Vercel CLI
        run: npm install -g vercel

      - name: Povuci Vercel podesavanja projekta
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # "vercel build" ovde interno pokrece "npm run build" (tsc + vite
      # build + prerender.mjs) - ali na OVOM runneru, gde Playwright radi.
      - name: Build projekta (ukljucuje prerendering)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Vercel sada samo prima vec zavrsen build, ne izvrsava svoj sopstveni.
      - name: Deploy vec izgradjenog sajta
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
